name: Build LUMEN GPU Windows x64
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  studio-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile installer and embedded Roblox scripts
        run: |
          curl -fLsS -o /tmp/luau.zip https://github.com/luau-lang/luau/releases/download/0.744/luau-ubuntu.zip
          unzip -q /tmp/luau.zip -d /tmp/luau
          python3 tests/check_studio.py /tmp/luau/luau-compile
  build:
    needs: studio-syntax
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Test and build bridge
        shell: pwsh
        run: |
          go mod tidy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags '-s -w' -o LumenBridge.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native renderer and shader
        shell: pwsh
        run: ./Build-Windows.ps1
      - name: Test Draco end-to-end through Go bridge
        shell: pwsh
        run: |
          $env:LUMEN_DRACO_TEST_EXE = (Resolve-Path dist/LumenDraco.exe).Path
          go test -run TestDraco -v ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: LumenGPU-0.9.8-Lumenus-Windows-x64
          path: dist/
          if-no-files-found: error
